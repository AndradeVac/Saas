services:
  - type: web
    name: mesa-digital-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migrations run on start because pre-deploy commands are not available on the free plan.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*" --timeout-graceful-shutdown 10
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      # Exact origins plus wildcard for every tenant subdomain.
      - key: FRONTEND_URL
        sync: false
      - key: ROOT_DOMAIN
        sync: false
      - key: PUBLIC_SCHEME
        value: https
      - key: PUBLIC_PORT
        value: ""
