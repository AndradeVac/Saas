# Fly.io: API + site in São Paulo (gru), next to the Neon database (sa-east-1).
# Antes do primeiro deploy, troque SEU-DOMINIO.com (3 lugares) e o nome do app. Passo a passo: DEPLOY.md
app = "mesa-digital"
primary_region = "gru"

[build]
  [build.args]
    VITE_ROOT_DOMAIN = "SEU-DOMINIO.com"

[deploy]
  # Runs once per deploy, before the new version takes traffic.
  release_command = "alembic upgrade head"

[env]
  ENVIRONMENT = "production"
  ROOT_DOMAIN = "SEU-DOMINIO.com"
  FRONTEND_URL = "https://SEU-DOMINIO.com,https://*.SEU-DOMINIO.com"
  PUBLIC_SCHEME = "https"
  PUBLIC_PORT = ""
  WEB_CONCURRENCY = "2"
  DB_POOL_SIZE = "5"
  DB_MAX_OVERFLOW = "5"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: a restaurant's first order of the day must not wait for a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
