# Fly.io: API + site in São Paulo (gru), next to the Neon database (sa-east-1).
# Domínio: mesadig.com.br. Se o nome do app estiver em uso no Fly, troque `app`. Passo a passo: DEPLOY.md
app = "mesa-digital"
primary_region = "gru"

[build]
  [build.args]
    VITE_ROOT_DOMAIN = "mesadig.com.br"

[deploy]
  # Runs once per deploy, before the new version takes traffic.
  release_command = "alembic upgrade head"

[env]
  ENVIRONMENT = "production"
  ROOT_DOMAIN = "mesadig.com.br"
  FRONTEND_URL = "https://mesadig.com.br,https://*.mesadig.com.br"
  PUBLIC_SCHEME = "https"
  PUBLIC_PORT = ""
  WEB_CONCURRENCY = "2"
  # Supabase session pooler (free): ~15 connections per user; 2 workers x (3 + 3) stays under it.
  DB_POOL_SIZE = "3"
  DB_MAX_OVERFLOW = "3"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: a restaurant's first order of the day must not wait for a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
